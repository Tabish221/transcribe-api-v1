<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MP3 Transcriber</title>
<style>
  :root { --bg:#f6f6f8; --card:#fff; --text:#1b1b1f; --muted:#6b6b76; --border:#e3e3ea; --accent:#6d28d9; --accent-soft:#ede9fe; --accent-text:#fff; --warn:#b45309; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#111115; --card:#1b1b21; --text:#ececf1; --muted:#9a9aa6; --border:#2d2d36; --accent:#a78bfa; --accent-soft:#2a2340; --accent-text:#0d0b14; --warn:#f59e0b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:820px; margin:0 auto; padding:32px 16px 120px; }
  .eyebrow { font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); font-weight:600; }
  h1 { font-size:26px; margin:4px 0 6px; }
  p.sub { color:var(--muted); margin:0 0 24px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:16px; }
  #drop { border:2px dashed var(--border); border-radius:12px; padding:28px; text-align:center; cursor:pointer; color:var(--muted); transition:border-color .15s; }
  #drop:hover, #drop.over { border-color:var(--accent); color:var(--text); }
  .row { display:flex; gap:12px; flex-wrap:wrap; margin-top:16px; align-items:flex-end; }
  label { display:flex; flex-direction:column; font-size:13px; color:var(--muted); gap:4px; flex:1; min-width:150px; }
  select, button { font:inherit; padding:8px 12px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text); }
  button { cursor:pointer; }
  button.primary { background:var(--accent); color:var(--accent-text); border:none; padding:10px 18px; font-weight:600; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #status { color:var(--muted); font-size:13px; margin-top:12px; min-height:20px; }
  progress { width:100%; height:6px; accent-color:var(--accent); }

  .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .toolbar .name { font-weight:600; text-transform:uppercase; letter-spacing:.05em; font-size:13px; margin-right:auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
  #lines { max-height:60vh; overflow-y:auto; }
  #lines:empty::before { content:"Your transcript will appear here, line by line."; color:var(--muted); display:block; padding:24px 0; text-align:center; }
  .line { display:flex; gap:14px; padding:8px 10px; border-radius:8px; align-items:flex-start; }
  .line.active { background:var(--accent-soft); }
  .line .t { font:12px/1.9 ui-monospace, Consolas, monospace; color:var(--accent); background:none; border:none; padding:0; min-width:52px; text-align:left; }
  .line .t:hover { text-decoration:underline; }
  .line .x { flex:1; outline:none; border-radius:4px; }
  .line .x:focus { box-shadow:0 0 0 2px var(--accent); }

  #player { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--border); padding:10px 16px; display:none; }
  #player audio { width:100%; max-width:820px; display:block; margin:0 auto; }
</style>
</head>
<body>
<main>
  <div class="eyebrow">On-device transcription</div>
  <h1>MP3 → Text</h1>
  <p class="sub" id="sub">Runs Whisper in your browser, so your audio never leaves your computer. Click a timestamp to hear it, click a line to fix a word.</p>

  <div class="card">
    <div id="drop">Drop an MP3 file here, or click to choose<br><small>.mp3 only</small></div>
    <input type="file" id="file" accept=".mp3,audio/mpeg" hidden>
    <div class="row">
      <label>Model
        <select id="model">
          <option value="onnx-community/whisper-tiny">Tiny (fastest, ~40 MB)</option>
          <option value="onnx-community/whisper-base">Base (balanced, ~80 MB)</option>
          <option value="onnx-community/whisper-small">Small (good, ~250 MB)</option>
          <option value="onnx-community/whisper-large-v3-turbo" selected>Large v3 Turbo (best, large download)</option>
        </select>
      </label>
      <label>Language
        <select id="lang">
          <option value="">Auto-detect</option>
          <option value="english">English</option>
          <option value="urdu">Urdu</option>
          <option value="hindi">Hindi</option>
          <option value="arabic">Arabic</option>
          <option value="spanish">Spanish</option>
          <option value="french">French</option>
          <option value="german">German</option>
        </select>
      </label>
      <label>Task
        <select id="task">
          <option value="transcribe">Transcribe (same language)</option>
          <option value="translate">Translate to English</option>
        </select>
      </label>
      <button class="primary" id="go" disabled>Transcribe</button>
    </div>
    <div id="status">Choose an MP3 to begin.</div>
    <progress id="bar" value="0" max="100" hidden></progress>
  </div>

  <div class="card">
    <div class="toolbar">
      <span class="name" id="name">Transcript</span>
      <button id="copy" disabled>Copy</button>
      <select id="fmt" disabled>
        <option value="txt">TXT</option>
        <option value="srt">SRT</option>
        <option value="vtt">VTT</option>
        <option value="json">JSON</option>
      </select>
      <button id="save" disabled>Save</button>
    </div>
    <div id="lines"></div>
  </div>
</main>

<div id="player"><audio id="audio" controls></audio></div>

<script type="module">
import { pipeline } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1";

const $ = id => document.getElementById(id);
let file = null, asr = null, loadedModel = null;
let segs = []; // { start, end, el }

const status = (msg) => $("status").textContent = msg;
if (location.protocol === "file:") {
  $("sub").innerHTML = "⚠️ Opened as a file, so the model <b>cannot be cached</b> and will re-download every time. Double-click <b>start.bat</b> instead to open it at http://localhost:8080.";
  $("sub").style.color = "var(--warn)";
}

const pick = (f) => {
  if (!f) return;
  if (!/\.mp3$/i.test(f.name) && f.type !== "audio/mpeg") { status("Only .mp3 files are supported."); return; }
  file = f;
  $("go").disabled = false;
  $("name").textContent = f.name.replace(/\.[^.]+$/, "");
  $("audio").src = URL.createObjectURL(f);
  $("player").style.display = "block";
  status(`Selected: ${f.name} (${(f.size / 1e6).toFixed(1)} MB)`);
};

$("drop").onclick = () => $("file").click();
$("file").onchange = e => pick(e.target.files[0]);
$("drop").ondragover = e => { e.preventDefault(); $("drop").classList.add("over"); };
$("drop").ondragleave = () => $("drop").classList.remove("over");
$("drop").ondrop = e => { e.preventDefault(); $("drop").classList.remove("over"); pick(e.dataTransfer.files[0]); };

// Decode the MP3 to 16 kHz mono, which is what Whisper expects
async function decode(f) {
  const ctx = new AudioContext({ sampleRate: 16000 });
  const buf = await ctx.decodeAudioData(await f.arrayBuffer());
  await ctx.close();
  let mono;
  if (buf.numberOfChannels === 1) mono = new Float32Array(buf.getChannelData(0));
  else {
    const a = buf.getChannelData(0), b = buf.getChannelData(1);
    mono = new Float32Array(a.length);
    for (let i = 0; i < a.length; i++) mono[i] = (a[i] + b[i]) / 2;
  }
  return normalize(mono);
}

// Boost quiet speech: scale each 5 s block toward a target loudness (capped so noise isn't blown up)
function normalize(x) {
  const BLOCK = 5 * 16000, TARGET = 0.1, MAX_GAIN = 8;
  let peak = 0;
  for (let i = 0; i < x.length; i++) peak = Math.max(peak, Math.abs(x[i]));
  if (peak > 0) for (let i = 0; i < x.length; i++) x[i] /= peak;
  for (let start = 0; start < x.length; start += BLOCK) {
    const end = Math.min(x.length, start + BLOCK);
    let sum = 0;
    for (let i = start; i < end; i++) sum += x[i] * x[i];
    const rms = Math.sqrt(sum / (end - start));
    if (rms < 0.005) continue; // silence, leave it alone
    const gain = Math.min(MAX_GAIN, TARGET / rms);
    if (gain <= 1) continue;
    for (let i = start; i < end; i++) x[i] = Math.max(-1, Math.min(1, x[i] * gain));
  }
  return x;
}

async function loadModel(name) {
  if (asr && loadedModel === name) return asr;
  const device = navigator.gpu ? "webgpu" : "wasm";
  const bar = $("bar"); bar.hidden = false;
  asr = await pipeline("automatic-speech-recognition", name, {
    device,
    // large-v3-turbo's full-precision encoder is too big for most GPUs, so use the 4-bit one
    dtype: device === "webgpu"
      ? { encoder_model: name.includes("large") ? "q4" : "fp32", decoder_model_merged: "q4" }
      : "q8",
    progress_callback: p => {
      if (p.status === "progress") { bar.value = p.progress; status(`Downloading model: ${p.file} ${p.progress.toFixed(0)}%`); }
    },
  });
  bar.hidden = true;
  loadedModel = name;
  return asr;
}

const clock = s => {
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : String(m).padStart(2, "0")) + ":" + String(sec).padStart(2, "0");
};

function addLine(start, end, text) {
  const row = document.createElement("div");
  row.className = "line";
  const t = document.createElement("button");
  t.className = "t"; t.textContent = clock(start); t.title = "Play from here";
  t.onclick = () => { const a = $("audio"); a.currentTime = start; a.play(); };
  const x = document.createElement("div");
  x.className = "x"; x.contentEditable = "true"; x.spellcheck = false; x.textContent = text;
  row.append(t, x);
  $("lines").append(row);
  segs.push({ start, end, el: row });
}

$("go").onclick = async () => {
  $("go").disabled = true;
  try {
    status("Loading model…");
    const model = await loadModel($("model").value);
    status("Decoding audio…");
    const audio = await decode(file);
    const t0 = performance.now();
    const opts = { return_timestamps: true, task: $("task").value };
    if ($("lang").value) opts.language = $("lang").value;

    // Each 30 s window starts where the last COMPLETE sentence ended, so a sentence
    // crossing a window edge is re-heard in full by the next window and never lost.
    const SR = 16000, WIN = 30, dur = audio.length / SR, bar = $("bar");
    segs = []; $("lines").innerHTML = ""; bar.value = 0; bar.hidden = false;
    let off = 0;
    while (off < dur - 0.5) {
      const elapsed = (performance.now() - t0) / 1000;
      const eta = off > 0 ? Math.round(elapsed / off * (dur - off)) : null;
      status(`Transcribing ${clock(off)} of ${clock(dur)}` + (eta !== null ? ` · about ${eta >= 60 ? Math.round(eta / 60) + " min" : eta + " s"} left` : "…"));
      const last = off + WIN >= dur;
      const res = await model(audio.subarray(Math.floor(off * SR), Math.floor((off + WIN) * SR)), opts);
      let next = null;
      for (const c of res.chunks || []) {
        const [a, b] = c.timestamp;
        if (!last && (b == null || b > WIN - 1)) break; // cut off by the window edge: redo in next window
        const text = c.text.trim();
        if (text) addLine(off + (a ?? 0), off + (b ?? WIN), text);
        next = off + (b ?? WIN);
      }
      off = last ? dur : (next && next > off + 1 ? next : off + WIN - 1);
      $("lines").scrollTop = $("lines").scrollHeight;
      bar.value = Math.min(off, dur) / dur * 100;
      if (segs.length) ["copy", "fmt", "save"].forEach(id => $(id).disabled = false);
    }
    bar.hidden = true;
    status(`Done in ${clock((performance.now() - t0) / 1000)} · ${segs.length} lines. Click a line to edit it.`);
  } catch (err) {
    console.error(err);
    status("Error: " + err.message);
  }
  $("go").disabled = false;
};

// Highlight the line being played
$("audio").ontimeupdate = () => {
  const now = $("audio").currentTime;
  for (const s of segs) s.el.classList.toggle("active", now >= s.start && now < s.end);
};

// Export (uses edited text)
const rows = () => segs.map(s => ({ start: s.start, end: s.end, text: s.el.querySelector(".x").textContent.trim() }));
const stamp = (s, sep) => {
  const ms = Math.round(s * 1000);
  return [Math.floor(ms / 3600000), Math.floor(ms / 60000) % 60, Math.floor(ms / 1000) % 60]
    .map(n => String(n).padStart(2, "0")).join(":") + sep + String(ms % 1000).padStart(3, "0");
};
const formats = {
  txt: r => r.map(x => x.text).join("\n"),
  srt: r => r.map((x, i) => `${i + 1}\n${stamp(x.start, ",")} --> ${stamp(x.end, ",")}\n${x.text}\n`).join("\n"),
  vtt: r => "WEBVTT\n\n" + r.map(x => `${stamp(x.start, ".")} --> ${stamp(x.end, ".")}\n${x.text}\n`).join("\n"),
  json: r => JSON.stringify(r, null, 2),
};

$("copy").onclick = () => navigator.clipboard.writeText(formats.txt(rows())).then(() => status("Copied to clipboard."));
$("save").onclick = () => {
  const fmt = $("fmt").value;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([formats[fmt](rows())], { type: "text/plain" }));
  a.download = ($("name").textContent || "transcript") + "." + fmt;
  a.click(); URL.revokeObjectURL(a.href);
};
</script>
</body>
</html>
